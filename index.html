<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>R36S · Cover Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  --bg-deep:#0a0710;
  --bg-panel:#141022;
  --bg-panel2:#1b1530;
  --violet:#8b2fd6;
  --violet-light:#b165f7;
  --violet-glow:#c98bff;
  --ink:#efe9ff;
  --ink-dim:#9d90c2;
  --line:#33285a;
  --accent-lime:#c7ea3f;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 10%, rgba(139,47,214,0.18), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(201,139,255,0.10), transparent 40%),
    var(--bg-deep);
  color:var(--ink);
  font-family:'Chakra Petch', sans-serif;
  min-height:100vh;
  padding:28px 20px 60px;
}

.wrap{
  max-width:1180px;
  margin:0 auto;
}

.masthead{
  display:flex;
  align-items:baseline;
  gap:14px;
  margin-bottom:6px;
  flex-wrap:wrap;
}
.masthead h1{
  font-family:'Bungee', sans-serif;
  font-size:28px;
  letter-spacing:1px;
  margin:0;
  color:var(--ink);
  text-shadow:0 0 18px rgba(177,101,247,0.5);
}
.masthead span{
  font-size:13px;
  color:var(--ink-dim);
  letter-spacing:2px;
  text-transform:uppercase;
}
.subhead{
  color:var(--ink-dim);
  font-size:14px;
  margin:0 0 30px;
  max-width:640px;
  line-height:1.5;
}

.layout{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:26px;
  align-items:start;
}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;}
}

.panel{
  background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel2));
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,0.45);
}

.field-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.field-head label{margin-bottom:0;}
.toggle{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:600;
  letter-spacing:0;
  text-transform:none;
  color:var(--ink-dim);
  cursor:pointer;
  user-select:none;
}
.toggle input{
  width:14px;height:14px;
  accent-color:var(--violet-light);
  cursor:pointer;
}

.field{margin-bottom:20px;}
.field:last-child{margin-bottom:0;}
.field label{
  display:block;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color:var(--violet-light);
  margin-bottom:8px;
}
.field .hint{
  font-size:11px;
  color:var(--ink-dim);
  margin-top:6px;
  line-height:1.4;
}

input[type=text]{
  width:100%;
  background:#0d0a18;
  border:1px solid var(--line);
  color:var(--ink);
  padding:11px 12px;
  border-radius:9px;
  font-family:'Rajdhani',sans-serif;
  font-size:16px;
  font-weight:600;
  outline:none;
  transition:border-color .15s;
}
input[type=text]:focus{border-color:var(--violet-light);}
input[type=text]::placeholder{color:#5c5280;}

.upload-zone{
  position:relative;
  border:2px dashed var(--line);
  border-radius:12px;
  padding:26px 14px;
  text-align:center;
  cursor:pointer;
  transition:border-color .15s, background .15s;
  background:#0d0a18;
}
.upload-zone:hover, .upload-zone.drag{
  border-color:var(--violet-light);
  background:#150f28;
}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-zone .icon{font-size:26px;display:block;margin-bottom:8px;opacity:0.8;}
.upload-zone .txt{font-size:13px;color:var(--ink-dim);}
.upload-zone .txt b{color:var(--violet-glow);}
.upload-zone.has-image .txt{color:var(--accent-lime);}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.swatches{display:flex;gap:9px;flex-wrap:wrap;}
.swatch{
  width:30px;height:30px;border-radius:50%;
  cursor:pointer;border:2px solid rgba(255,255,255,0.15);
  transition:transform .12s, border-color .12s;
}
.swatch:hover{transform:scale(1.1);}
.swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--bg-panel), 0 0 0 4px currentColor;}

.range-field input[type=range]{
  width:100%;accent-color:var(--violet-light);
}

.btn-download{
  width:100%;
  margin-top:24px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg, var(--violet-light), var(--violet));
  color:#fff;
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:16px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(139,47,214,0.4);
  transition:transform .12s, box-shadow .12s;
}
.btn-download:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(139,47,214,0.55);}
.btn-download:active{transform:translateY(0);}

.preview-col{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.canvas-shell{
  position:relative;
  filter:drop-shadow(0 25px 45px rgba(0,0,0,0.55));
}
#cardCanvas{
  width:100%;
  max-width:420px;
  height:auto;
  display:block;
  border-radius:22px;
}
.preview-note{
  margin-top:16px;
  font-size:12px;
  color:var(--ink-dim);
  text-align:center;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Cover Generator</h1>
    <span></span>
  </div>
  <p class="subhead">Upload the artwork, type the game's title and info. The cover builds itself in the panel on the right, ready to download as a PNG.</p>

  <div class="layout">

    <!-- CONTROLS -->
    <div class="panel">

      <div class="field">
        <label>Game artwork</label>
        <div class="upload-zone" id="dropZone">
          <input type="file" id="artInput" accept="image/*">
          <span class="icon">🖼️</span>
          <span class="txt" id="uploadTxt"><b>Click</b> or drag an image here</span>
        </div>
        <div class="hint">Recommended: square image, minimum 800×800px.</div>
      </div>

      <div class="field">
        <div class="field-head">
          <label>Game title</label>
          <label class="toggle"><input type="checkbox" id="showTitle" checked> Show</label>
        </div>
        <input type="text" id="titleInput" placeholder="GAME TITLE" maxlength="24" value="GAME TITLE">
      </div>

      <div class="field">
        <div class="field-head">
          <label>Subtitle / info</label>
          <label class="toggle"><input type="checkbox" id="showSubtitle" checked> Show</label>
        </div>
        <input type="text" id="subInput" placeholder="SUBTITLE / PORT INFO" maxlength="36" value="SUBTITLE / PORT INFO">
      </div>

      <div class="field">
        <label>Accent color</label>
        <div class="swatches" id="swatches">
          <div class="swatch active" style="background:#8b2fd6;color:#8b2fd6" data-color="#8b2fd6,#c98bff"></div>
          <div class="swatch" style="background:#1fa7d6;color:#1fa7d6" data-color="#1265a8,#5ec7f2"></div>
          <div class="swatch" style="background:#e0364f;color:#e0364f" data-color="#a3132a,#ff6b7e"></div>
          <div class="swatch" style="background:#2fae6a;color:#2fae6a" data-color="#0f7a41,#7fe6ab"></div>
          <div class="swatch" style="background:#e08a1f;color:#e08a1f" data-color="#b5610a,#ffc266"></div>
          <div class="swatch" style="background:#3a3f4a;color:#3a3f4a" data-color="#1c1f26,#7d8697"></div>
        </div>
      </div>

      <button class="btn-download" id="downloadBtn">⬇ Download Cover PNG</button>
    </div>

    <!-- PREVIEW -->
    <div class="preview-col">
      <div class="canvas-shell">
        <canvas id="cardCanvas" width="1024" height="1230"></canvas>
      </div>
      <div class="preview-note">Live preview — updates as you type</div>
    </div>

  </div>
</div>

<script>
const canvas = document.getElementById('cardCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let artImage = null;
let accent = {main:'#8b2fd6', light:'#c98bff'};

const titleInput = document.getElementById('titleInput');
const subInput = document.getElementById('subInput');
const showTitle = document.getElementById('showTitle');
const showSubtitle = document.getElementById('showSubtitle');
const artInput = document.getElementById('artInput');
const dropZone = document.getElementById('dropZone');
const uploadTxt = document.getElementById('uploadTxt');

function roundRectPath(c, x, y, w, h, r){
  if (typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
  c.beginPath();
  c.moveTo(x+r.tl, y);
  c.lineTo(x+w-r.tr, y);
  c.arcTo(x+w, y, x+w, y+r.tr, r.tr);
  c.lineTo(x+w, y+h-r.br);
  c.arcTo(x+w, y+h, x+w-r.br, y+h, r.br);
  c.lineTo(x+r.bl, y+h);
  c.arcTo(x, y+h, x, y+h-r.bl, r.bl);
  c.lineTo(x, y+r.tl);
  c.arcTo(x, y, x+r.tl, y, r.tl);
  c.closePath();
}

function drawWrappedFit(text, maxWidth, baseSize, family, weight='700'){
  let size = baseSize;
  ctx.font = `${weight} ${size}px ${family}`;
  while (ctx.measureText(text).width > maxWidth && size > 10){
    size -= 2;
    ctx.font = `${weight} ${size}px ${family}`;
  }
  return size;
}

function fitTitleLines(text, maxWidth, maxHeight, family, maxLines){
  let size = 130;
  while (size > 28){
    ctx.font = `400 ${size}px ${family}`;
    const words = text.split(' ');
    let lines = [], cur = '';
    for (const w of words){
      const test = cur ? cur+' '+w : w;
      if (ctx.measureText(test).width <= maxWidth || !cur){
        cur = test;
      } else {
        lines.push(cur);
        cur = w;
      }
    }
    if (cur) lines.push(cur);
    const fits = lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxWidth);
    const lineH = size*1.08;
    if (fits && lines.length*lineH <= maxHeight) return {size, lines, lineH};
    size -= 3;
  }
  ctx.font = `400 ${size}px ${family}`;
  return {size, lines:[text], lineH:size*1.08};
}

function buildCardPath(x, y, w, h){
  const r = 40;
  ctx.beginPath();
  ctx.moveTo(x+r, y);

  // top edge → diagonal chamfer at top-right
  const diagStartX = x + w*0.80;
  const diagEndY = y + h*0.155;
  ctx.lineTo(diagStartX, y);
  ctx.lineTo(x+w, diagEndY);

  // right edge → single notch
  const rNotchTop = y + h*0.32;
  const rNotchH = h*0.05;
  const rNotchD = w*0.022;
  ctx.lineTo(x+w, rNotchTop);
  ctx.lineTo(x+w-rNotchD, rNotchTop);
  ctx.lineTo(x+w-rNotchD, rNotchTop+rNotchH);
  ctx.lineTo(x+w, rNotchTop+rNotchH);
  ctx.lineTo(x+w, y+h-r);

  // bottom-right corner
  ctx.arcTo(x+w, y+h, x+w-r, y+h, r);

  // bottom edge → two small connector nubs
  const nubDepth = h*0.014;
  const n2s = x+w*0.275, n2e = x+w*0.37;
  const n1s = x+w*0.14,  n1e = x+w*0.235;
  ctx.lineTo(n2e, y+h);
  ctx.lineTo(n2e, y+h-nubDepth);
  ctx.lineTo(n2s, y+h-nubDepth);
  ctx.lineTo(n2s, y+h);
  ctx.lineTo(n1e, y+h);
  ctx.lineTo(n1e, y+h-nubDepth);
  ctx.lineTo(n1s, y+h-nubDepth);
  ctx.lineTo(n1s, y+h);
  ctx.lineTo(x+r, y+h);

  // bottom-left corner
  ctx.arcTo(x, y+h, x, y+h-r, r);

  // left edge → two stacked notches
  const lNotchD = w*0.022;
  const l2Top = y+h*0.455, l2Bot = y+h*0.505;
  const l1Top = y+h*0.345, l1Bot = y+h*0.395;
  ctx.lineTo(x, l2Bot);
  ctx.lineTo(x+lNotchD, l2Bot);
  ctx.lineTo(x+lNotchD, l2Top);
  ctx.lineTo(x, l2Top);
  ctx.lineTo(x, l1Bot);
  ctx.lineTo(x+lNotchD, l1Bot);
  ctx.lineTo(x+lNotchD, l1Top);
  ctx.lineTo(x, l1Top);
  ctx.lineTo(x, y+r);

  // top-left corner
  ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // outer card — SD-card silhouette: diagonal top-right chamfer, side notches, bottom nubs
  const pad = 20;
  const cardX = pad, cardY = pad, cardW = W-pad*2, cardH = H-pad*2;

  ctx.save();

  // white die-cut outline
  buildCardPath(cardX, cardY, cardW, cardH);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 22;
  ctx.stroke();

  // black casing fill
  ctx.fillStyle = '#17141f';
  ctx.fill();
  ctx.clip();

  //ARTWORK
  const diagEndY = cardH*0.155;
  const topMargin = diagEndY+26, sideMargin = 34, bottomMargin = 34;
  const frameX = cardX+sideMargin, frameY = cardY+topMargin;
  const frameW = cardW-sideMargin*2, frameH = cardH-topMargin-bottomMargin;

  roundRectPath(ctx, frameX, frameY, frameW, frameH, 22);
  ctx.fillStyle = '#211c30';
  ctx.fill();

  ctx.save();
  roundRectPath(ctx, frameX, frameY, frameW, frameH, 22);
  ctx.clip();
  if (artImage){
    const iw = artImage.width, ih = artImage.height;
    const scale = Math.max(frameW/iw, frameH/ih);
    const dw = iw*scale, dh = ih*scale;
    const dx = frameX + (frameW-dw)/2;
    const dy = frameY + (frameH-dh)/2;
    ctx.drawImage(artImage, dx, dy, dw, dh);
  } else {
    const cell = 28;
    for (let y=0; y<frameH; y+=cell){
      for (let x=0; x<frameW; x+=cell){
        const on = ((x/cell + y/cell) % 2) === 0;
        ctx.fillStyle = on ? '#2a2438' : '#241f31';
        ctx.fillRect(frameX+x, frameY+y, cell, cell);
      }
    }
    ctx.fillStyle = 'rgba(200,190,220,0.55)';
    ctx.textAlign = 'center';
    ctx.font = "700 26px 'Rajdhani', sans-serif";
    ctx.fillText('UPLOAD YOUR ARTWORK', frameX+frameW/2, frameY+frameH/2+10);
    ctx.textAlign = 'left';
  }

  ctx.restore();

  // accent border frame
  roundRectPath(ctx, frameX, frameY, frameW, frameH, 22);
  ctx.strokeStyle = accent.light;
  ctx.lineWidth = 6;
  ctx.stroke();

  //SUBTITLE
  const subText = showSubtitle.checked ? (subInput.value || '').toUpperCase() : '';
  const subH = 56;
  const subY = frameY+frameH-24-subH;
  if (subText){
    ctx.fillStyle = accent.main;
    ctx.fillRect(frameX, subY, frameW, subH);
    ctx.fillStyle = '#ffffff';
    ctx.font = "700 30px 'Rajdhani', sans-serif";
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText(subText, frameX+frameW/2, subY+subH/2+2);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  // TITLE
  if (showTitle.checked){
    const titleText = (titleInput.value || 'GAME TITLE').toUpperCase();
    const titleAreaX = cardX+38;
    const titleAreaW = cardW-76;
    const titleAreaBottom = frameY-18;
    const titleAreaTop = cardY+34;
    const {size:tSize, lines, lineH} = fitTitleLines(titleText, titleAreaW, titleAreaBottom-titleAreaTop, "'Russo One', sans-serif", 2);
    ctx.font = `400 ${tSize}px 'Russo One', sans-serif`;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.textAlign = 'left';

    lines.forEach((line, i) => {
      const y = titleAreaBottom - (lines.length-1-i)*lineH;
      // soft accent glow + thin dark outline for crispness against the black margin
      ctx.save();
      ctx.shadowColor = accent.light;
      ctx.shadowBlur = 18;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = tSize*0.07;
      ctx.strokeText(line, titleAreaX, y);
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(line, titleAreaX, y);
    });
  }

  //R36S CORNER MARK
  const tagW = 150, tagH = 56;
  const tagX = frameX+frameW-tagW-18, tagY = frameY+18;
  roundRectPath(ctx, tagX, tagY, tagW, tagH, 10);
  ctx.fillStyle = accent.main;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = "700 30px 'Rajdhani', sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('R36S', tagX+tagW/2, tagY+tagH/2+1);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  ctx.restore(); // end outer clip
}

// ---- image upload ----
function handleFile(file){
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      artImage = img;
      uploadTxt.innerHTML = '<b>✓ ' + file.name + '</b>';
      dropZone.classList.add('has-image');
      draw();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
artInput.addEventListener('change', e => handleFile(e.target.files[0]));
['dragover'].forEach(evt=>dropZone.addEventListener(evt, e=>{e.preventDefault();dropZone.classList.add('drag');}));
['dragleave','drop'].forEach(evt=>dropZone.addEventListener(evt, e=>{e.preventDefault();dropZone.classList.remove('drag');}));
dropZone.addEventListener('drop', e=>{
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

document.getElementById('swatches').addEventListener('click', e=>{
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  sw.classList.add('active');
  const [main, light] = sw.dataset.color.split(',');
  accent = {main, light};
  draw();
});

[titleInput, subInput, showTitle, showSubtitle].forEach(inp=>{
  inp.addEventListener('input', draw);
  inp.addEventListener('change', draw);
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const link = document.createElement('a');
  const name = (titleInput.value||'cover').trim().replace(/[^a-z0-9\-_ ]/gi,'').replace(/\s+/g,'_') || 'cover';
  link.download = name + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// wait for fonts then first draw
document.fonts.ready.then(draw);
draw();
setTimeout(draw, 400); // safety redraw once webfonts settle
</script>
</body>
</html>
